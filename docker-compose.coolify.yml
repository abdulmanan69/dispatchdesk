# Coolify deployment: same single container, no host port (Coolify's proxy routes the domain to port 3000).
# Data (SQLite database, uploads, generated secret) lives in the named volume and survives redeploys.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      DATABASE_URL: file:/data/app.db
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EXPOSE_DEV_TOKENS: "false"
    expose:
      - "3000"
    volumes:
      - dispatchdesk-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  dispatchdesk-data:
